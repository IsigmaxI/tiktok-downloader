name: Download TikTok Videos

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Paste one or more TikTok links separated by spaces"
        required: true
        type: string

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"

      - name: Install fixed downloader versions
        run: |
          python -m pip install "curl_cffi==0.15.0" "yt-dlp==2026.7.4"
          yt-dlp --list-impersonate-targets

      - name: Validate TikTok links
        env:
          TIKTOK_URLS: ${{ inputs.urls }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          urls = os.environ["TIKTOK_URLS"].split()
          allowed_hosts = {
              "tiktok.com",
              "www.tiktok.com",
              "vm.tiktok.com",
              "vt.tiktok.com",
          }

          if not urls:
              raise SystemExit("No links were provided.")

          for url in urls:
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname not in allowed_hosts:
                  raise SystemExit(f"Invalid TikTok link: {url}")

          with open("urls.txt", "w", encoding="utf-8") as file:
              file.write("\n".join(urls) + "\n")

          print(f"Validated {len(urls)} TikTok link(s).")
          PY

      - name: Download videos
        run: |
          mkdir -p videos
          yt-dlp \
            --batch-file urls.txt \
            --impersonate chrome \
            --no-playlist \
            --continue \
            --format-sort "vcodec:h264" \
            --merge-output-format mp4 \
            --remux-video mp4 \
            -o "videos/%(autonumber)02d - %(uploader)s - %(id)s.%(ext)s"

      - name: Upload downloaded videos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tiktok-videos-${{ github.run_number }}
          path: videos/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1
